<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal Seba</title>
  <style>
    :root{
      --primary:#157993;
      --bg:#07161b;
      --panel:#0b2530;
      --text:#e9f6fa;
      --muted:#a9c7d1;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(21,121,147,.25), transparent 60%),
        radial-gradient(700px 400px at 100% 0%, rgba(127,229,255,.14), transparent 55%),
        radial-gradient(900px 500px at 0% 100%, rgba(21,121,147,.14), transparent 55%),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      padding:18px;
    }
    .wrap{width:min(980px, 96vw);}
    .card{
      background: rgba(11,37,48,.78);
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:18px 16px 16px;
    }
    .head{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin-bottom:14px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
    }
    .logo{
      width:44px;height:44px;border-radius:14px;
      background: rgba(21,121,147,.20);
      border: 1px solid rgba(21,121,147,.32);
      display:grid;place-items:center;
    }
    .logo svg{width:26px;height:26px;fill: rgba(233,246,250,.92);}
    h1{margin:0;font-size:18px;letter-spacing:.2px}
    .sub{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.35}

    .row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start}
    .col{flex:1; min-width: 260px}

    label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
    input{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(21,121,147,.45);
      background:#0b2530;
      color:var(--text);
      outline:none;
      font-size:14px;
    }
    button{
      margin-top:12px;
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(21,121,147,.55);
      background: rgba(21,121,147,.28);
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      font-size:14px;
    }
    button:hover{background: rgba(21,121,147,.36);}
    .btn-ghost{
      width:auto;
      padding:10px 12px;
      margin:0;
      background: rgba(233,246,250,.06);
      border:1px solid rgba(233,246,250,.10);
      font-weight:800;
    }
    .btn-ghost:hover{background: rgba(233,246,250,.10);}

    .error{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background: rgba(255, 211, 126, .12);
      border:1px solid rgba(255, 211, 126, .22);
      color: var(--text);
      font-size:13px;
      font-weight:800;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap:12px;
      margin-top: 6px;
    }
    .tile{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:14px 14px 12px;
      border-radius:16px;
      background: linear-gradient(180deg, rgba(11,37,48,.84), rgba(11,37,48,.62));
      border: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 10px 22px rgba(0,0,0,.28);
      text-decoration:none;
      color: var(--text);
    }
    .tile:hover{
      border-color: rgba(21,121,147,.35);
      background: linear-gradient(180deg, rgba(11,37,48,.88), rgba(11,37,48,.66));
    }
    .tile-title{
      font-weight:900;
      letter-spacing:.2px;
    }
    .tile-desc{
      color: var(--muted);
      font-size:12px;
      line-height:1.35;
    }
    .badge{
      align-self:flex-start;
      padding:5px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      border: 1px solid rgba(21,121,147,.30);
      background: rgba(21,121,147,.18);
    }

    .hidden{display:none}
    footer{
      margin-top:12px;
      text-align:center;
      color: rgba(169,199,209,.88);
      font-size:12px;
    }
    code{color:#7fe5ff}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- LOGIN -->
    <div id="login" class="card">
      <div class="head">
        <div class="brand">
          <div class="logo" aria-label="Banco">
            <svg viewBox="0 0 64 64"><path d="M32 6 6 18v6h52v-6L32 6zm-20 18h40v26H12V24zm-4 30h48v6H8v-6z"/></svg>
          </div>
          <div>
            <h1>Portal Seba</h1>
            <div class="sub">Accesos rápidos (puerta visual). Guardá esta página en favoritos.</div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <div class="sub">Ingresá la clave para desbloquear el menú.</div>
          <div id="err" class="error">Clave incorrecta.</div>

          <label for="key">Clave</label>
          <input id="key" type="password" placeholder="Ingresá tu clave" autocomplete="current-password" />
          <button id="btn">Entrar</button>

          <div class="sub" style="margin-top:10px">
            Ingrese la clave para continuar al portal.
          </div>
        </div>

        <div class="col">
          <!--div class="sub"><b>Config rápida</b> (editable dentro del HTML):</div-->
          <!--div class="sub">- Cambiá <code>PORTAL_KEY</code> por tu clave</div-->
          <div class="sub">- Editá la lista de links en <code>LINKS</code></div>
        </div>
      </div>
    </div>

    <!-- APP -->
    <div id="app" class="card hidden">
      <div class="head">
        <div class="brand">
          <div class="logo" aria-label="Portal">
            <svg viewBox="0 0 64 64"><path d="M12 10h40v8H12v-8zm0 14h40v30H12V24zm8 6h24v6H20v-6zm0 10h24v6H20v-6z"/></svg>
          </div>
          <div>
            <h1>Portal</h1>
            <div class="sub">Accesos rápidos</div>
          </div>
        </div>
        <button id="logout" class="btn-ghost">Cerrar sesión</button>
      </div>

      <div class="grid" id="grid"></div>

      <footer>
        2026 - Todos los derechos reservados.
      </footer>
    </div>
  </div>

<script>
  /***********************************************************
   * CONFIG PORTAL (EDITÁ ESTO)
   ***********************************************************/
  const PORTAL_KEY = "SNA01cc0001"; // <-- Cambiala
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwKJf6HOdMMnuAcbxVM6mQPK07NRoiCEIFmiY-4BcWLnAfoRksLy_9kHvpNDxkon74r/exec";
  const WEBAPP2_URL = "https://script.google.com/macros/s/AKfycbyI6ne3sC-SMo6rDriE7Ovad61gk_byJR0ncvxMYZyDu4GMWoan8Qpj_5W9hz0q3HVVpA/exec";

  // Links del portal (editables)
  const LINKS = [
    {
      title: "Cumpleaños (Web App)",
      desc: "Listado dinámico de cumpleañeros por área.",
      href: "https://script.google.com/macros/s/AKfycbwKJf6HOdMMnuAcbxVM6mQPK07NRoiCEIFmiY-4BcWLnAfoRksLy_9kHvpNDxkon74r/exec",
      badge: "WEBAPP"
    },
    {
      title: "Drive (Carpeta IN)",
      desc: "Input del TXT.",
      href: "https://drive.google.com/drive/folders/1V4x3PzOdHxeFiYGapTu3h4ddaSHD5Z8a",
      badge: "DRIVE"
    },
    {
      title: "Drive (Carpeta OUT)",
      desc: "Output (Salida guarda HTML/CSV).",
      href: "https://drive.google.com/drive/folders/1-0W9_wZvZ3E50UWaBZ6SR6-MS3j6geOF",
      badge: "DRIVE"
    }
    // Agregá más accesos acá
  ];

  /***********************************************************
   * LOGICA
   ***********************************************************/
  const $ = (id) => document.getElementById(id);
  const login = $("login");
  const app = $("app");
  const grid = $("grid");
  const err = $("err");
  const key = $("key");
  const btn = $("btn");
  const logout = $("logout");

  const STORAGE_KEY = "portal_seba_ok";

  function showApp(){
    login.classList.add("hidden");
    app.classList.remove("hidden");
    renderLinks();
  }

  function showLogin(){
    app.classList.add("hidden");
    login.classList.remove("hidden");
    err.style.display = "none";
    key.value = "";
    key.focus();
  }

/*  function renderLinks(){
    grid.innerHTML = LINKS.map(x => `
      <a class="tile" href="${x.href}" target="_blank" rel="noopener">
        <div class="badge">${x.badge || "LINK"}</div>
        <div class="tile-title">${x.title}</div>
        <div class="tile-desc">${x.desc || ""}</div>
      </a>
    `).join("");
  }
*/

function renderLinks(){
  const token = localStorage.getItem("portal_token") || "";
  const cumplesUrl = token
    ? `${WEBAPP_URL}?action=view&token=${encodeURIComponent(token)}`
    : WEBAPP_URL;

  const anivUrl = token
    ? `${WEBAPP2_URL}?action=view&token=${encodeURIComponent(token)}`
    : WEBAPP2_URL;
  
  const linksRuntime = [
    {
      title: "Cumpleaños (hoy)",
      desc: "Listado dinámico de cumpleañeros por área.",
      href: cumplesUrl,
      badge: "CUMPLES"
    },
    {
      title: "Cumpleaños (otra fecha)",
      desc: "Te pide YYYYMMDD y abre el listado.",
      href: "#",
      badge: "FECHA",
      onclick: true
    },
    {
      title: "Aniversario BNA (hoy)",
      desc: "Listado dinámico de aniversarios por área.",
      href: anivUrl,
      badge: "CUMPLES"
    },
    {
      title: "Drive (Carpeta IN)",
      desc: "Input del TXT.",
      href: "https://drive.google.com/drive/folders/1V4x3PzOdHxeFiYGapTu3h4ddaSHD5Z8a",
      badge: "DRIVE"
    },
    {
      title: "Drive (Carpeta OUT)",
      desc: "Output (Salida guarda HTML/CSV).",
      href: "https://drive.google.com/drive/folders/1-0W9_wZvZ3E50UWaBZ6SR6-MS3j6geOF",
      badge: "DRIVE"
    }
  ];

  grid.innerHTML = linksRuntime.map((x, i) => `
    <a class="tile" href="${x.href}" data-idx="${i}" target="_blank" rel="noopener">
      <div class="badge">${x.badge || "LINK"}</div>
      <div class="tile-title">${x.title}</div>
      <div class="tile-desc">${x.desc || ""}</div>
    </a>
  `).join("");

  // hook para "otra fecha"
  [...grid.querySelectorAll('a[data-idx]')].forEach(a=>{
    const idx = Number(a.getAttribute("data-idx"));
    if(idx === 1){
      a.addEventListener("click", (ev)=>{
        ev.preventDefault();
        const t = localStorage.getItem("portal_token") || "";
        if(!t){ alert("No hay token. Logueate de nuevo."); return; }
        const f = prompt("Fecha YYYYMMDD (ej 20260228):");
        if(!f) return;
        window.open(`${WEBAPP_URL}?action=view&token=${encodeURIComponent(t)}&fecha=${encodeURIComponent(f)}`, "_blank");
      });
    }
  });
}
  
  
/*  function loginAttempt(){
    err.style.display = "none";
    const v = (key.value || "").trim();

    if (v !== PORTAL_KEY) {
      err.style.display = "block";
      return;
    }

    localStorage.setItem(STORAGE_KEY, "1");
    showApp();
  }
*/

  async function loginAttempt(){
    err.style.display = "none";
    const v = (key.value || "").trim();
    if (!v) return;
  
    try{
      const url = `${WEBAPP_URL}?action=auth&key=${encodeURIComponent(v)}`;
      const res = await fetch(url);
      const data = await res.json();
  
      if(!data || !data.ok || !data.token){
        err.style.display = "block";
        return;
      }
  
      // guardo token y exp
      localStorage.setItem("portal_token", data.token);
      localStorage.setItem("portal_token_exp", String(data.exp || ""));
  
      showApp();
    }catch(e){
      err.style.display = "block";
    }
  }
  
  btn.addEventListener("click", loginAttempt);
  key.addEventListener("keydown", (e) => { if (e.key === "Enter") loginAttempt(); });

  logout.addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);

    // limpia seguridad real (token)
    localStorage.removeItem("portal_token");
    localStorage.removeItem("portal_token_exp");
    
    showLogin();
  });

  // Auto-login si ya validó antes
  if (localStorage.getItem(STORAGE_KEY) === "1") {
    showApp();
  } else {
    showLogin();
  }
</script>
</body>
</html>
